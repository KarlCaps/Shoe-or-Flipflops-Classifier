<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Offline Shoe Classifier</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>Offline Shoe Classifier</h1>

        <p class="description">
            Upload an image and let the machine learning model
            identify the type of footwear.
        </p>

        <!-- Image upload -->
        <div class="upload-box">

            <label for="imageUpload" class="upload-button">
                Choose Image
            </label>

            <input
                type="file"
                id="imageUpload"
                accept="image/*"
            >

        </div>


        <!-- Image preview -->
        <div class="preview-container">

            <img
                id="imagePreview"
                src=""
                alt="Image Preview"
            >

        </div>


        <!-- Predict button -->
        <button id="predictButton" disabled>
            Predict
        </button>


        <!-- Loading message -->
        <p id="loadingMessage">
            Loading machine learning model...
        </p>


        <!-- Result -->
        <div class="result-box">

            <h2>Prediction</h2>

            <p id="prediction">
                No prediction yet.
            </p>

        </div>


        <!-- Confidence results -->
        <div class="confidence-box">

            <div class="class-result">

                <span>Sneakers</span>

                <div class="progress">
                    <div
                        id="sneakersBar"
                        class="progress-bar"
                    ></div>
                </div>

                <span id="sneakersConfidence">
                    0%
                </span>

            </div>


            <div class="class-result">

                <span>Flipflops</span>

                <div class="progress">
                    <div
                        id="flipflopsBar"
                        class="progress-bar"
                    ></div>
                </div>

                <span id="flipflopsConfidence">
                    0%
                </span>

            </div>

        </div>

    </div>


    <!-- TensorFlow.js -->
    <script src="tensorflow/tf.min.js"></script>

    <!-- Your JavaScript -->
    <script src="script.js"></script>

</body>

</html>
